<!-- index.html -->
<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login Lib Demo</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  /* Minimal styling just for demo */
  .hidden { display: none !important; }
</style>
</head>
<body>

<div id="login-screen">
  <input type="email" id="email" placeholder="Email">
  <input type="password" id="password" placeholder="Password">
  <button id="email-login">Login / Register</button>
  <div>--- OR ---</div>
  <button id="google-login">Continue with Google</button>
</div>

<div id="profile-screen" class="hidden">
  <img id="profile-photo" width="140" height="140" alt="Avatar">
  <div id="profile-name"></div>
  <div id="profile-email"></div>
  <button id="logout-btn">Logout</button>
</div>

<div id="overlay" class="hidden">
  <pre id="overlay-info"></pre>
  <button id="close-overlay">Close</button>
</div>

<script>
  // --- Data-driven JS library ---
  const LoginLib = (() => {
    let config = {};
    let isPrompting = false;
    let googleInitialized = false;

    const init = (cfg) => {
      config = cfg;
      const {
        clientId,
        selectors: s
      } = cfg;

      // Initialize Google
      if (!googleInitialized && window.google?.accounts?.id) {
        google.accounts.id.initialize({
          client_id: clientId,
          callback: handleCredentialResponse,
          auto_select: false,
          cancel_on_tap_outside: true
        });
        googleInitialized = true;
      }

      // Check saved profile
      const saved = localStorage.getItem('userProfile');
      if (saved) showProfile(JSON.parse(saved));

      // Event listeners
      document.querySelector(s.emailLoginBtn)?.addEventListener('click', () => {
        const email = document.querySelector(s.emailInput).value.trim();
        const pass = document.querySelector(s.passwordInput).value;
        loginWithEmail(email, pass);
      });

      document.querySelector(s.googleLoginBtn)?.addEventListener('click', () => {
        if (isPrompting) return;
        isPrompting = true;
        google.accounts.id.prompt();
        setTimeout(() => { isPrompting = false; }, 2500);
      });

      document.querySelector(s.logoutBtn)?.addEventListener('click', logout);

      document.querySelector(s.overlayClose)?.addEventListener('click', () => {
        document.querySelector(s.overlay).classList.add('hidden');
      });

      document.querySelector(s.overlay)?.addEventListener('click', e => {
        if (e.target === document.querySelector(s.overlay)) {
          document.querySelector(s.overlay).classList.add('hidden');
        }
      });
    };

    const loginWithEmail = (email, pass) => {
      if (!email || !pass) return alert("Please fill email & password!");
      const fakeUser = {
        name: email.split('@')[0],
        given_name: email.split('@')[0],
        email,
        sub: 'demo-' + Date.now(),
        picture: `https://ui-avatars.com/api/?name=${encodeURIComponent(email.split('@')[0])}&size=140&background=1f1f1f&color=f5f5f5`,
        login_method: 'Email'
      };
      showProfile(fakeUser);
    };

    const handleCredentialResponse = (response) => {
      try {
        const base64Url = response.credential.split('.')[1];
        const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
        const jsonPayload = decodeURIComponent(atob(base64).split('').map(c =>
          '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)
        ).join(''));
        const user = JSON.parse(jsonPayload);
        showProfile(user);
      } catch (err) {
        showOverlay({ error: "Google login failed", details: err.message });
      }
    };

    const showProfile = (user) => {
      const s = config.selectors;
      document.querySelector(s.loginScreen).classList.add('hidden');
      document.querySelector(s.profileScreen).classList.remove('hidden');

      document.querySelector(s.profilePhoto).src = user.picture || '';
      document.querySelector(s.profileName).textContent = user.name || 'User';
      document.querySelector(s.profileEmail).textContent = user.email || '-';

      localStorage.setItem('userProfile', JSON.stringify(user));
    };

    const logout = () => {
      localStorage.removeItem('userProfile');
      if (window.google?.accounts?.id) {
        google.accounts.id.revoke();
        google.accounts.id.disableAutoSelect();
      }
      const s = config.selectors;
      document.querySelector(s.loginScreen).classList.remove('hidden');
      document.querySelector(s.profileScreen).classList.add('hidden');
      document.querySelector(s.emailInput).value = '';
      document.querySelector(s.passwordInput).value = '';
    };

    const showOverlay = (data) => {
      const s = config.selectors;
      document.querySelector(s.overlayInfo).textContent = JSON.stringify(data, null, 2);
      document.querySelector(s.overlay).classList.remove('hidden');
    };

    return { init, loginWithEmail, logout, showOverlay };
  })();

  // --- Initialize library ---
  LoginLib.init({
    clientId: "436345541922-lb7misltboaosc02tg48v8ij7hq5uhv8.apps.googleusercontent.com",
    selectors: {
      loginScreen: '#login-screen',
      profileScreen: '#profile-screen',
      emailInput: '#email',
      passwordInput: '#password',
      emailLoginBtn: '#email-login',
      googleLoginBtn: '#google-login',
      profilePhoto: '#profile-photo',
      profileName: '#profile-name',
      profileEmail: '#profile-email',
      logoutBtn: '#logout-btn',
      overlay: '#overlay',
      overlayInfo: '#overlay-info',
      overlayClose: '#close-overlay'
    }
  });
</script>
</body>
</html>
