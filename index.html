<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login / Profile</title>

  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <style>
    :root {
      --bg: #050505;
      --surface: #0f0f0f;
      --surface-hover: #181818;
      --text: #f5f5f5;
      --text-muted: #a0a0a0;
      --accent: #4285f4;
      --border: #2a2a2a;
      --radius: 16px;
      --shadow: 0 6px 20px rgba(0,0,0,0.6);
      --shadow-hover: 0 12px 32px rgba(0,0,0,0.75);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Roboto', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 20px;
    }

    h1 {
      font-weight: 400;
      font-size: clamp(2rem, 6vw, 2.6rem);
      margin-bottom: 40px;
      text-align: center;
      letter-spacing: -0.5px;
    }

    .container {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    input {
      width: 100%;
      padding: 16px 18px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      font-size: 16px;
      background: var(--surface);
      color: var(--text);
      transition: border-color 0.2s ease;
    }

    input::placeholder {
      color: #777;
    }

    input:focus {
      outline: none;
      border-color: var(--accent);
    }

    button {
      padding: 16px 18px;
      border-radius: var(--radius);
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      border: none;
      transition: all 0.2s ease;
      min-height: 56px;
    }

    #email-login,
    #google-login {
      background: var(--surface);
      color: var(--text);
      box-shadow: var(--shadow);
    }

    #email-login:hover,
    #google-login:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-hover);
      background: var(--surface-hover);
    }

    .separator {
      display: flex;
      align-items: center;
      text-align: center;
      color: var(--text-muted);
      font-weight: 500;
      margin: 12px 0;
      font-size: 0.95rem;
    }

    .separator::before,
    .separator::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid var(--border);
      margin: 0 16px;
    }

    #google-login {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
    }

    #google-login img {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #fff;
      padding: 3px;
    }

    /* Profile */
    #profile-screen {
      text-align: center;
    }

    .profile-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 32px;
    }

    .profile-photo {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid var(--border);
      box-shadow: var(--shadow);
      margin-bottom: 16px;
      transition: transform 0.3s ease;
    }

    .profile-photo:hover {
      transform: scale(1.05);
    }

    .profile-name {
      font-size: 2rem;
      font-weight: 500;
      margin-bottom: 8px;
    }

    .profile-email {
      font-size: 1.1rem;
      color: var(--text-muted);
      margin-bottom: 24px;
    }

    .profile-info {
      background: var(--surface);
      padding: 24px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      margin-bottom: 32px;
      text-align: left;
    }

    .profile-info p {
      margin: 14px 0;
      font-size: 1.05rem;
    }

    .profile-info strong {
      color: var(--text);
    }

    #logout-btn {
      background: #c62828;
      color: white;
      font-weight: 500;
      box-shadow: 0 4px 12px rgba(198,40,40,0.3);
    }

    #logout-btn:hover {
      background: #d32f2f;
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(198,40,40,0.5);
    }

    /* Overlay */
    #overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.92);
      backdrop-filter: blur(10px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      padding: 20px;
    }

    #overlay.show {
      display: flex;
    }

    #overlay .content {
      background: var(--surface);
      padding: 32px 28px;
      border-radius: var(--radius);
      width: 100%;
      max-width: 420px;
      max-height: 85vh;
      overflow-y: auto;
      border: 1px solid var(--border);
      box-shadow: var(--shadow-hover);
      text-align: center;
    }

    #close-overlay {
      margin-top: 24px;
      padding: 14px;
      border-radius: var(--radius);
      background: #333;
      color: #fff;
      cursor: pointer;
      font-weight: 500;
      width: 100%;
      border: none;
      transition: background 0.2s ease;
    }

    #close-overlay:hover {
      background: #444;
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 480px) {
      body { padding: 32px 20px; }
      .profile-photo { width: 120px; height: 120px; }
      h1 { font-size: 2.2rem; margin-bottom: 36px; }
      button, input { font-size: 15.5px; padding: 14px 15px; }
    }
  </style>
</head>
<body>

<div class="container" id="login-screen">
  <h1>Welcome</h1>

  <input type="email" id="email" placeholder="Email" autocomplete="email">
  <input type="password" id="password" placeholder="Password" autocomplete="current-password">
  <button id="email-login">Login / Register</button>

  <div class="separator">OR</div>

  <button id="google-login">
    <img src="https://developers.google.com/identity/images/g-logo.png" alt="Google logo">
    Continue with Google
  </button>
</div>

<div class="container hidden" id="profile-screen">
  <h1>Profile</h1>

  <div class="profile-header">
    <img id="profile-photo" class="profile-photo" src="https://via.placeholder.com/140?text=?" alt="Profile photo">
    <div class="profile-name" id="profile-name">Welcome</div>
    <div class="profile-email" id="profile-email">...</div>
  </div>

  <div class="profile-info">
    <p><strong>Name:</strong> <span id="display-name">-</span></p>
    <p><strong>Email:</strong> <span id="display-email">-</span></p>
    <p><strong>ID:</strong> <span id="user-id">-</span></p>
    <p><strong>Logged in via:</strong> <span id="login-method">Unknown</span></p>
  </div>

  <button id="logout-btn">Log out</button>
</div>

<div id="overlay">
  <div class="content">
    <h2>Info</h2>
    <pre id="overlay-info"></pre>
    <button id="close-overlay">Close</button>
  </div>
</div>

<script>
  const loginScreen = document.getElementById('login-screen');
  const profileScreen = document.getElementById('profile-screen');

  function showOverlay(data) {
    document.getElementById('overlay-info').textContent = JSON.stringify(data, null, 2);
    document.getElementById('overlay').classList.add('show');
  }

  function showProfile(user) {
    const photo = user.picture || `https://ui-avatars.com/api/?name=${encodeURIComponent(user.name || user.email?.split('@')[0] || 'User')}&size=140&background=1f1f1f&color=f5f5f5`;
    document.getElementById('profile-photo').src = photo;

    document.getElementById('profile-name').textContent = user.name || user.given_name || 'User';
    document.getElementById('profile-email').textContent = user.email || 'Unknown';

    document.getElementById('display-name').textContent = user.name || '-';
    document.getElementById('display-email').textContent = user.email || '-';
    document.getElementById('user-id').textContent = user.sub || '-';
    document.getElementById('login-method').textContent = user.iss?.includes('google') ? 'Google' : 'Email / Manual';

    loginScreen.classList.add('hidden');
    profileScreen.classList.remove('hidden');

    localStorage.setItem('userProfile', JSON.stringify(user));
  }

  function logout() {
    localStorage.removeItem('userProfile');

    if (window.google?.accounts?.id) {
      google.accounts.id.revoke();
      google.accounts.id.disableAutoSelect();
    }

    loginScreen.classList.remove('hidden');
    profileScreen.classList.add('hidden');
    document.getElementById('email').value = '';
    document.getElementById('password').value = '';

    // Small delay + reload ensures clean Google session state
    setTimeout(() => {
      window.location.reload();
    }, 400);
  }

  function handleCredentialResponse(response) {
    try {
      const base64Url = response.credential.split('.')[1];
      const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
      const jsonPayload = decodeURIComponent(atob(base64).split('').map(c =>
        '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)
      ).join(''));
      const user = JSON.parse(jsonPayload);
      showProfile(user);
    } catch (err) {
      showOverlay({ error: "Failed to process Google login", details: err.message });
    }
  }

  let isPrompting = false;

  window.addEventListener('load', () => {
    google.accounts.id.initialize({
      client_id: "436345541922-lb7misltboaosc02tg48v8ij7hq5uhv8.apps.googleusercontent.com",
      callback: handleCredentialResponse,
      auto_select: false,
      cancel_on_tap_outside: true,
      use_fedcm_for_prompt: false
    });

    const saved = localStorage.getItem('userProfile');
    if (saved) {
      showProfile(JSON.parse(saved));
    }

    document.getElementById('google-login').addEventListener('click', () => {
      if (isPrompting) return;
      isPrompting = true;
      google.accounts.id.prompt();
      setTimeout(() => { isPrompting = false; }, 2500);
    });

    document.getElementById('email-login').addEventListener('click', () => {
      const email = document.getElementById('email').value.trim();
      const pass = document.getElementById('password').value;

      if (email && pass) {
        const fakeUser = {
          name: email.split('@')[0],
          given_name: email.split('@')[0],
          email: email,
          sub: 'demo-' + Date.now(),
          picture: `https://ui-avatars.com/api/?name=${encodeURIComponent(email.split('@')[0])}&size=140&background=1f1f1f&color=f5f5f5`,
          login_method: 'Email'
        };
        showProfile(fakeUser);
      } else {
        alert("Please fill in email and password!");
      }
    });

    document.getElementById('logout-btn').addEventListener('click', logout);

    document.getElementById('close-overlay').addEventListener('click', () => {
      document.getElementById('overlay').classList.remove('show');
    });

    document.getElementById('overlay').addEventListener('click', e => {
      if (e.target === document.getElementById('overlay')) {
        document.getElementById('overlay').classList.remove('show');
      }
    });
  });
</script>
</body>
</html>
