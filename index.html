<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Custom Google Sign-In</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    /* Voorbeeld custom button styling */
    #custom-google-btn {
      background-color: #4285F4;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 16px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    #custom-google-btn img {
      width: 24px;
      height: 24px;
    }
    #custom-google-btn:hover {
      background-color: #357ae8;
    }
  </style>
</head>
<body>
  <h1>Custom Google Sign-In Demo</h1>

  <!-- Onze custom button -->
  <button id="custom-google-btn">
    <img src="https://developers.google.com/identity/images/g-logo.png" alt="Google logo">
    Sign in with Google
  </button>

  <h2>Gebruiker info:</h2>
  <pre id="user-info">Niet ingelogd</pre>

  <script>
    // Callback functie voor Google Sign-In
    function handleCredentialResponse(response) {
      const base64Url = response.credential.split('.')[1];
      const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
      const jsonPayload = decodeURIComponent(atob(base64).split('').map(c =>
          '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)
      ).join(''));
      const user = JSON.parse(jsonPayload);
      document.getElementById('user-info').textContent = JSON.stringify(user, null, 2);
    }

    window.onload = () => {
      google.accounts.id.initialize({
        client_id: "436345541922-lb7misltboaosc02tg48v8ij7hq5uhv8.apps.googleusercontent.com",
        callback: handleCredentialResponse
      });

      // Trigger Google login bij klik op onze custom button
      document.getElementById('custom-google-btn').addEventListener('click', () => {
        google.accounts.id.prompt(); // optioneel automatisch prompt
        google.accounts.id.request(); // start de credential flow
      });
    };
  </script>
</body>
</html>
