<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login / Register</title>

  <!-- Google SDK -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <style>
    :root {
      --bg: #0a0a0a;
      --surface: #121212;
      --surface-hover: #1a1a1a;
      --text: #f0f0f0;
      --text-muted: #aaaaaa;
      --border: #333333;
      --focus: #555555;
      --radius: 12px;
      --shadow: 0 4px 12px rgba(0,0,0,0.5);
      --shadow-hover: 0 8px 20px rgba(0,0,0,0.65);
    }

    * { margin:0; padding:0; box-sizing:border-box; }

    body {
      font-family: 'Roboto', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 20px;
    }

    h1 {
      font-weight: 400;
      font-size: clamp(1.9rem, 5.5vw, 2.4rem);
      margin-bottom: 44px;
      text-align: center;
    }

    .auth-container {
      display: flex;
      flex-direction: column;
      gap: 16px;
      width: 100%;
      max-width: 380px;
    }

    input {
      width: 100%;
      padding: 15px 16px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      font-size: 16px;
      background: #1f1f1f;
      color: #fff;
      transition: border-color 0.15s ease;
    }

    input::placeholder { color: #888; }

    input:focus {
      outline: none;
      border-color: var(--focus);
    }

    button {
      padding: 15px 16px;
      border-radius: var(--radius);
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      border: none;
      transition: transform 0.12s ease, box-shadow 0.18s ease;
      min-height: 54px;
    }

    #mail-login,
    #custom-google-btn {
      background: #1f1f1f;
      color: #fff;
      box-shadow: var(--shadow);
    }

    #mail-login:hover,
    #custom-google-btn:hover,
    #mail-login:focus,
    #custom-google-btn:focus {
      transform: translateY(-2px);
      box-shadow: var(--shadow-hover);
    }

    .separator {
      display: flex;
      align-items: center;
      text-align: center;
      color: #888;
      font-weight: 500;
      margin: 12px 0;
      font-size: 0.95rem;
    }

    .separator::before,
    .separator::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid #333;
      margin: 0 14px;
    }

    #custom-google-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
    }

    #custom-google-btn img {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #fff;
      padding: 2px;
    }

    /* Overlay */
    #user-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.90);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      padding: 20px;
    }

    #user-overlay.show { display: flex; }

    #user-overlay .content {
      background: #1f1f1f;
      padding: 32px 28px;
      border-radius: 16px;
      width: 100%;
      max-width: 400px;
      max-height: 85vh;
      overflow-y: auto;
      border: 1px solid #333;
      box-shadow: 0 16px 50px rgba(0,0,0,0.8);
    }

    #user-overlay h2 {
      font-size: 1.45rem;
      margin-bottom: 20px;
      text-align: center;
    }

    #user-overlay pre {
      text-align: left;
      background: #0d0d0d;
      padding: 18px;
      border-radius: 10px;
      overflow-x: auto;
      color: #eee;
      font-size: 0.94rem;
      line-height: 1.5;
    }

    #close-overlay {
      margin-top: 24px;
      padding: 14px;
      border-radius: var(--radius);
      background: #333;
      color: #fff;
      cursor: pointer;
      font-weight: 500;
      width: 100%;
      border: none;
      transition: background 0.15s ease;
    }

    #close-overlay:hover { background: #444; }

    @media (max-width: 480px) {
      body { padding: 32px 20px; }
      h1 { font-size: 2rem; margin-bottom: 36px; }
      .auth-container { gap: 14px; }
      button, input { font-size: 15.5px; padding: 14px 15px; }
    }
  </style>
</head>
<body>

<h1>Welcome</h1>

<div class="auth-container">
  <input type="email" id="email" placeholder="Email" autocomplete="email">
  <input type="password" id="password" placeholder="Password" autocomplete="current-password">
  <button id="mail-login">Login / Register</button>

  <div class="separator">OR</div>

  <button id="custom-google-btn">
    <img src="https://developers.google.com/identity/images/g-logo.png" alt="Google logo">
    Continue with Google
  </button>
</div>

<div id="user-overlay">
  <div class="content">
    <h2>Gebruiker info</h2>
    <pre id="user-info"></pre>
    <button id="close-overlay">Sluit</button>
  </div>
</div>

<script>
  function showOverlay(userData) {
    document.getElementById('user-info').textContent = JSON.stringify(userData, null, 2);
    document.getElementById('user-overlay').classList.add('show');
  }

  function handleCredentialResponse(response) {
    try {
      const base64Url = response.credential.split('.')[1];
      const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
      const jsonPayload = decodeURIComponent(atob(base64).split('').map(c =>
        '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)
      ).join(''));
      const user = JSON.parse(jsonPayload);
      showOverlay(user);
    } catch (err) {
      showOverlay({ error: "Google login verwerken mislukt", details: err.message });
    }
  }

  let isPrompting = false; // voorkom dubbele prompts

  window.addEventListener('load', () => {
    google.accounts.id.initialize({
      client_id: "436345541922-lb7misltboaosc02tg48v8ij7hq5uhv8.apps.googleusercontent.com",
      callback: handleCredentialResponse,
      auto_select: false,
      cancel_on_tap_outside: true,
      use_fedcm_for_prompt: false  // ← Belangrijk! Voorkomt FedCM cooldown → herhaald login werkt beter
    });

    const googleBtn = document.getElementById('custom-google-btn');

    googleBtn.addEventListener('click', () => {
      if (isPrompting) return; // voorkom spam

      isPrompting = true;
      google.accounts.id.prompt();

      // Reset na korte delay (Google blokkeert soms kort na prompt)
      setTimeout(() => { isPrompting = false; }, 2000);
    });

    // Mail login
    document.getElementById('mail-login').addEventListener('click', () => {
      const email = document.getElementById('email').value.trim();
      const pass = document.getElementById('password').value;

      if (email && pass) {
        showOverlay({ email, password: '*'.repeat(pass.length) });
      } else {
        alert("Vul e-mail en wachtwoord in!");
      }
    });

    // Sluiten overlay
    document.getElementById('close-overlay').addEventListener('click', () => {
      document.getElementById('user-overlay').classList.remove('show');
    });

    document.getElementById('user-overlay').addEventListener('click', e => {
      if (e.target === document.getElementById('user-overlay')) {
        document.getElementById('user-overlay').classList.remove('show');
      }
    });
  });
</script>
</body>
</html>
