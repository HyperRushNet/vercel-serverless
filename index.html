<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login / Register</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">

  <!-- Google SDK -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <style>
    :root {
      --bg: #0a0a0a;
      --surface: #121212;
      --surface-hover: #1a1a1a;
      --text: #f0f0f0;
      --text-muted: #aaaaaa;
      --border: #333333;
      --radius: 12px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Roboto', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 20px; /* Meer zij-padding op mobile */
    }

    h1 {
      font-weight: 400;
      font-size: 2.2rem;
      margin-bottom: 40px;
      text-align: center;
    }

    .auth-container {
      display: flex;
      flex-direction: column;
      gap: 16px;
      width: 100%;
      max-width: 380px;
    }

    input {
      width: 100%;
      padding: 14px 16px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      font-size: 16px;
      background: #1f1f1f;
      color: #fff;
    }

    input::placeholder {
      color: #aaa;
    }

    input:focus {
      outline: none;
      border-color: #555;
    }

    button {
      padding: 14px 16px;
      border-radius: var(--radius);
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      border: none;
      transition: transform 0.12s ease, box-shadow 0.18s ease;
      min-height: 52px;
    }

    #mail-login {
      background: #1f1f1f;
      color: #fff;
      box-shadow: 0 3px 10px rgba(0,0,0,0.4);
    }

    #mail-login:hover,
    #mail-login:focus {
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(0,0,0,0.55);
    }

    .separator {
      display: flex;
      align-items: center;
      text-align: center;
      color: #888;
      font-weight: 500;
      margin: 12px 0;
      font-size: 0.9rem;
    }

    .separator::before,
    .separator::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid #333;
      margin: 0 12px;
    }

    /* Custom-wrapped Google knop */
    .google-wrapper {
      width: 100%;
      height: 52px;
      border-radius: var(--radius);
      overflow: hidden;
      border: 1px solid var(--border);
      transition: border-color 0.15s ease, box-shadow 0.18s ease;
      box-shadow: 0 3px 10px rgba(0,0,0,0.4);
      color-scheme: light; /* Fix voor witte achtergrond in dark mode */
    }

    .google-wrapper:hover {
      border-color: #555;
      box-shadow: 0 6px 18px rgba(0,0,0,0.55);
    }

    /* Overlay modal – gecentreerd */
    #user-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.88);
      backdrop-filter: blur(6px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      padding: 20px;
    }

    #user-overlay.show {
      display: flex;
    }

    #user-overlay .content {
      background: #1f1f1f;
      padding: 32px 28px;
      border-radius: 16px;
      width: 100%;
      max-width: 380px;
      max-height: 85dvh;
      overflow-y: auto;
      border: 1px solid #333;
      box-shadow: 0 12px 40px rgba(0,0,0,0.7);
    }

    #user-overlay h2 {
      font-size: 1.4rem;
      margin-bottom: 20px;
      text-align: center;
    }

    #user-overlay pre {
      text-align: left;
      background: #0d0d0d;
      padding: 16px;
      border-radius: 10px;
      overflow-x: auto;
      color: #eee;
      font-size: 0.92rem;
    }

    #close-overlay {
      margin-top: 24px;
      padding: 12px;
      border-radius: var(--radius);
      background: #333;
      color: #fff;
      cursor: pointer;
      font-weight: 500;
      width: 100%;
      border: none;
    }

    #close-overlay:hover {
      background: #444;
    }

    @media (max-width: 480px) {
      body { padding: 32px 20px; }
      h1 { font-size: 1.9rem; margin-bottom: 32px; }
      .auth-container { gap: 14px; }
    }
  </style>
</head>
<body>

<h1>Welcome</h1>

<div class="auth-container">
  <input type="email" id="email" placeholder="Email">
  <input type="password" id="password" placeholder="Password">
  <button id="mail-login">Login / Register</button>

  <div class="separator">OR</div>

  <!-- Google SDK knop met dark mode fix -->
  <div class="google-wrapper">
    <div id="google-btn"></div>
  </div>
</div>

<!-- Overlay modal -->
<div id="user-overlay">
  <div class="content">
    <h2>Gebruiker info</h2>
    <pre id="user-info"></pre>
    <button id="close-overlay">Sluit</button>
  </div>
</div>

<script>
  function showOverlay(userData) {
    document.getElementById('user-info').textContent = JSON.stringify(userData, null, 2);
    document.getElementById('user-overlay').classList.add('show');
  }

  function handleCredentialResponse(response) {
    const base64Url = response.credential.split('.')[1];
    const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
    const jsonPayload = decodeURIComponent(atob(base64).split('').map(c =>
      '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)
    ).join(''));
    const user = JSON.parse(jsonPayload);
    showOverlay(user);
  }

  // Init Google SDK
  function initGoogle() {
    if (!window.google?.accounts?.id) return;

    google.accounts.id.initialize({
      client_id: "436345541922-lb7misltboaosc02tg48v8ij7hq5uhv8.apps.googleusercontent.com",
      callback: handleCredentialResponse,
      auto_select: false,
      cancel_on_tap_outside: true
    });

    google.accounts.id.renderButton(
      document.getElementById("google-btn"),
      {
        type: "standard",
        theme: "filled_black",     // Donkere gevulde knop – past bij je thema
        size: "large",
        text: "continue_with",
        shape: "rectangular",
        logo_alignment: "left",
        width: "100%"
      }
    );
  }

  // Wacht op SDK load
  window.addEventListener('load', () => {
    if (window.google?.accounts?.id) {
      initGoogle();
    } else {
      const check = setInterval(() => {
        if (window.google?.accounts?.id) {
          clearInterval(check);
          initGoogle();
        }
      }, 300);
    }
  });

  // Email/password handler
  document.getElementById('mail-login').addEventListener('click', () => {
    const email = document.getElementById('email').value.trim();
    const pass = document.getElementById('password').value;

    if (email && pass) {
      showOverlay({ email, password: '*'.repeat(pass.length) });
    } else {
      alert("Vul e-mail en wachtwoord in!");
    }
  });

  // Sluiten overlay
  document.getElementById('close-overlay').addEventListener('click', () => {
    document.getElementById('user-overlay').classList.remove('show');
  });

  // Sluiten bij klik buiten modal (optioneel maar fijn)
  document.getElementById('user-overlay').addEventListener('click', e => {
    if (e.target === document.getElementById('user-overlay')) {
      document.getElementById('user-overlay').classList.remove('show');
    }
  });
</script>
</body>
</html>
