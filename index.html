<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login / Profiel</title>

  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <style>
    :root {
      --bg: #0a0a0a;
      --surface: #121212;
      --surface-hover: #1a1a1a;
      --text: #f0f0f0;
      --text-muted: #aaaaaa;
      --border: #333333;
      --focus: #555555;
      --radius: 12px;
      --shadow: 0 4px 12px rgba(0,0,0,0.5);
      --shadow-hover: 0 8px 20px rgba(0,0,0,0.65);
    }

    * { margin:0; padding:0; box-sizing:border-box; }

    body {
      font-family: 'Roboto', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 20px;
    }

    h1 {
      font-weight: 400;
      font-size: clamp(1.9rem, 5.5vw, 2.4rem);
      margin-bottom: 32px;
      text-align: center;
    }

    .container {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Login scherm */
    input {
      width: 100%;
      padding: 15px 16px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      font-size: 16px;
      background: #1f1f1f;
      color: #fff;
      transition: border-color 0.15s ease;
    }

    input::placeholder { color: #888; }

    input:focus {
      outline: none;
      border-color: var(--focus);
    }

    button {
      padding: 15px 16px;
      border-radius: var(--radius);
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      border: none;
      transition: transform 0.12s ease, box-shadow 0.18s ease;
      min-height: 54px;
    }

    #mail-login,
    #custom-google-btn {
      background: #1f1f1f;
      color: #fff;
      box-shadow: var(--shadow);
    }

    #mail-login:hover,
    #custom-google-btn:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-hover);
    }

    .separator {
      display: flex;
      align-items: center;
      text-align: center;
      color: #888;
      font-weight: 500;
      margin: 12px 0;
      font-size: 0.95rem;
    }

    .separator::before,
    .separator::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid #333;
      margin: 0 14px;
    }

    #custom-google-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
    }

    #custom-google-btn img {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #fff;
      padding: 2px;
    }

    /* Profiel scherm */
    .profile {
      text-align: center;
    }

    .profile-photo {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #333;
      margin-bottom: 20px;
      box-shadow: var(--shadow);
    }

    .profile-name {
      font-size: 1.8rem;
      margin-bottom: 8px;
    }

    .profile-email {
      font-size: 1.1rem;
      color: var(--text-muted);
      margin-bottom: 30px;
    }

    .profile-info {
      background: #1f1f1f;
      padding: 20px;
      border-radius: var(--radius);
      border: 1px solid #333;
      margin-bottom: 30px;
      text-align: left;
    }

    .profile-info p {
      margin: 12px 0;
      font-size: 1rem;
    }

    #logout-btn {
      background: #c62828;
      color: white;
      font-weight: 500;
    }

    #logout-btn:hover {
      background: #d32f2f;
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(200,40,40,0.4);
    }

    /* Overlay (voor errors of extra info) */
    #overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.88);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      padding: 20px;
    }

    #overlay.show { display: flex; }

    #overlay .content {
      background: #1f1f1f;
      padding: 32px 28px;
      border-radius: 16px;
      width: 100%;
      max-width: 400px;
      max-height: 85vh;
      overflow-y: auto;
      border: 1px solid #333;
      box-shadow: 0 16px 50px rgba(0,0,0,0.8);
      text-align: center;
    }

    #close-overlay {
      margin-top: 24px;
      padding: 14px;
      border-radius: var(--radius);
      background: #333;
      color: #fff;
      cursor: pointer;
      font-weight: 500;
      width: 100%;
      border: none;
    }

    #close-overlay:hover { background: #444; }

    .hidden { display: none !important; }
  </style>
</head>
<body>

<div class="container" id="login-screen">
  <h1>Welcome</h1>

  <input type="email" id="email" placeholder="Email" autocomplete="email">
  <input type="password" id="password" placeholder="Password" autocomplete="current-password">
  <button id="mail-login">Login / Register</button>

  <div class="separator">OR</div>

  <button id="custom-google-btn">
    <img src="https://developers.google.com/identity/images/g-logo.png" alt="Google logo">
    Continue with Google
  </button>
</div>

<!-- Profiel scherm (verborgen bij start) -->
<div class="container profile hidden" id="profile-screen">
  <h1>Profiel</h1>

  <img id="profile-photo" class="profile-photo" src="https://via.placeholder.com/120?text=?" alt="Profielfoto">

  <div class="profile-name" id="profile-name">Welkom</div>
  <div class="profile-email" id="profile-email">...</div>

  <div class="profile-info">
    <p><strong>Naam:</strong> <span id="display-name">-</span></p>
    <p><strong>E-mail:</strong> <span id="display-email">-</span></p>
    <p><strong>ID:</strong> <span id="user-id">-</span></p>
    <p><strong>Ingelogd via:</strong> <span id="login-method">Onbekend</span></p>
  </div>

  <button id="logout-btn">Uitloggen</button>
</div>

<!-- Overlay voor extra info / errors -->
<div id="overlay">
  <div class="content">
    <h2>Info</h2>
    <pre id="overlay-info"></pre>
    <button id="close-overlay">Sluiten</button>
  </div>
</div>

<script>
  const loginScreen = document.getElementById('login-screen');
  const profileScreen = document.getElementById('profile-screen');

  function showOverlay(data) {
    document.getElementById('overlay-info').textContent = JSON.stringify(data, null, 2);
    document.getElementById('overlay').classList.add('show');
  }

  function showProfile(user) {
    // Foto (Google geeft vaak picture URL)
    const photo = user.picture || 'https://via.placeholder.com/120?text=' + (user.given_name?.[0] || '?');
    document.getElementById('profile-photo').src = photo;

    document.getElementById('profile-name').textContent = user.name || user.given_name || 'Gebruiker';
    document.getElementById('profile-email').textContent = user.email || 'Onbekend';

    document.getElementById('display-name').textContent = user.name || '-';
    document.getElementById('display-email').textContent = user.email || '-';
    document.getElementById('user-id').textContent = user.sub || '-';
    document.getElementById('login-method').textContent = user.iss?.includes('google') ? 'Google' : 'E-mail';

    loginScreen.classList.add('hidden');
    profileScreen.classList.remove('hidden');
  }

  function logout() {
    // Simpele logout: clear state + reload
    localStorage.removeItem('user');
    loginScreen.classList.remove('hidden');
    profileScreen.classList.add('hidden');
    document.getElementById('email').value = '';
    document.getElementById('password').value = '';
  }

  function handleCredentialResponse(response) {
    try {
      const base64Url = response.credential.split('.')[1];
      const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
      const jsonPayload = decodeURIComponent(atob(base64).split('').map(c =>
        '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)
      ).join(''));
      const user = JSON.parse(jsonPayload);
      showProfile(user);
      localStorage.setItem('user', JSON.stringify(user));
    } catch (err) {
      showOverlay({ error: "Google login verwerken mislukt", details: err.message });
    }
  }

  let isPrompting = false;

  window.addEventListener('load', () => {
    google.accounts.id.initialize({
      client_id: "436345541922-lb7misltboaosc02tg48v8ij7hq5uhv8.apps.googleusercontent.com",
      callback: handleCredentialResponse,
      auto_select: false,
      cancel_on_tap_outside: true,
      use_fedcm_for_prompt: false  // voorkomt cooldown → beter voor herhaald testen
    });

    const savedUser = localStorage.getItem('user');
    if (savedUser) {
      showProfile(JSON.parse(savedUser));
    }

    document.getElementById('custom-google-btn').addEventListener('click', () => {
      if (isPrompting) return;
      isPrompting = true;
      google.accounts.id.prompt();
      setTimeout(() => { isPrompting = false; }, 2500);
    });

    document.getElementById('mail-login').addEventListener('click', () => {
      const email = document.getElementById('email').value.trim();
      const pass = document.getElementById('password').value;

      if (email && pass) {
        const fakeUser = {
          name: email.split('@')[0],
          email: email,
          sub: 'demo-' + Date.now(),
          picture: 'https://via.placeholder.com/120?text=' + email[0].toUpperCase(),
          methode: 'E-mail'
        };
        showProfile(fakeUser);
        localStorage.setItem('user', JSON.stringify(fakeUser));
      } else {
        alert("Vul e-mail en wachtwoord in!");
      }
    });

    document.getElementById('logout-btn').addEventListener('click', logout);

    document.getElementById('close-overlay').addEventListener('click', () => {
      document.getElementById('overlay').classList.remove('show');
    });

    document.getElementById('overlay').addEventListener('click', e => {
      if (e.target === document.getElementById('overlay')) {
        document.getElementById('overlay').classList.remove('show');
      }
    });
  });
</script>
</body>
</html>
