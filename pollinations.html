<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <title>Pollinations AI Demo</title>
</head>
<body>
  <h1>Pollinations AI Demo</h1>

  <button id="loginBtn">🔑 Login & Get API Key</button>
  <p id="keyMsg"></p>

  <hr>
  <h2>Genereer tekst</h2>
  <input type="text" id="textPrompt" placeholder="Typ iets liefs..." size="40">
  <button id="generateTextBtn">Genereer Tekst</button>
  <pre id="textOutput"></pre>

  <hr>
  <h2>Genereer image</h2>
  <input type="text" id="imagePrompt" placeholder="Typ een image prompt..." size="40">
  <button id="generateImageBtn">Genereer Image</button>
  <div id="imageOutput"></div>

  <script>
    const keyMsg = document.getElementById("keyMsg");
    const loginBtn = document.getElementById("loginBtn");

    const hashParams = new URLSearchParams(window.location.hash.slice(1));
    let apiKey = hashParams.get("api_key") || localStorage.getItem("pollinations_api_key");

    if (apiKey) {
      keyMsg.textContent = "🎉 Je API Key is: " + apiKey;
      localStorage.setItem("pollinations_api_key", apiKey);
    }

    loginBtn.addEventListener("click", () => {
      const redirectUrl = encodeURIComponent(window.location.href.split("#")[0]);
      const authUrl = `https://enter.pollinations.ai/authorize?redirect_url=${redirectUrl}`;
      window.location.href = authUrl;
    });

    // Tekst genereren met JSON correctie
    document.getElementById("generateTextBtn").addEventListener("click", async () => {
      const promptInput = document.getElementById("textPrompt").value;
      if (!apiKey) return alert("Login eerst om een API key te krijgen.");

      // Voeg expliciet "return JSON" toe voor jsonMode
      const prompt = `Antwoord in een JSON Object genaamd "messages", hier is mijn prompt: ${promptInput}`;

      try {
        const res = await fetch(`https://gen.pollinations.ai/text/${encodeURIComponent(prompt)}?jsonMode=true`, {
          headers: { "Authorization": `Bearer ${apiKey}` }
        });
        const data = await res.json();
        // Haal JSON uit data
        document.getElementById("textOutput").textContent = data.message || JSON.stringify(data, null, 2);
      } catch(err) {
        document.getElementById("textOutput").textContent = "Fout: " + err.message;
      }
    });

    // Image genereren (geen JSON nodig)
    document.getElementById("generateImageBtn").addEventListener("click", async () => {
      const prompt = document.getElementById("imagePrompt").value;
      if (!apiKey) return alert("Login eerst om een API key te krijgen.");

      try {
        const res = await fetch(`https://gen.pollinations.ai/image/${encodeURIComponent(prompt)}`, {
          headers: { "Authorization": `Bearer ${apiKey}` }
        });
        const blob = await res.blob();
        const url = URL.createObjectURL(blob);
        const imgEl = document.createElement("img");
        imgEl.src = url;
        imgEl.style.maxWidth = "500px";
        const outputDiv = document.getElementById("imageOutput");
        outputDiv.innerHTML = "";
        outputDiv.appendChild(imgEl);
      } catch(err) {
        document.getElementById("imageOutput").textContent = "Fout: " + err.message;
      }
    });
  </script>
</body>
</html>
