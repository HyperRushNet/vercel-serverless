<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<title>Pollinations AI Chat</title>

<style>
body{
font-family:Arial;
max-width:800px;
margin:auto;
padding:20px;
background:#f4f4f4;
}

button{
padding:8px 14px;
margin:5px;
cursor:pointer;
}

input{
padding:8px;
width:70%;
}

#chat{
background:white;
border:1px solid #ccc;
padding:15px;
height:400px;
overflow-y:auto;
margin-top:20px;
}

.msg{
margin-bottom:15px;
}

.ai{
color:#0a4;
}

.user{
color:#06c;
}

img{
max-width:300px;
display:block;
margin-top:10px;
border-radius:6px;
}
</style>
</head>

<body>

<h1>Pollinations AI Chat</h1>

<button id="login">🔑 Login</button>
<button id="logout">🗑 Remove Key</button>

<p id="keystatus">Geen API key</p>

<hr>

<input id="prompt" placeholder="Typ iets...">
<button id="send">Send</button>

<div id="chat"></div>

<script>

const chat = document.getElementById("chat")
const promptInput = document.getElementById("prompt")
const keyStatus = document.getElementById("keystatus")

const hash = new URLSearchParams(window.location.hash.slice(1))
let apiKey = hash.get("api_key") || localStorage.getItem("pollinations_key")

if(hash.get("api_key")){
localStorage.setItem("pollinations_key",apiKey)
window.location.hash=""
}

updateKey()

function updateKey(){
keyStatus.textContent = apiKey ? "API key opgeslagen ✅" : "Geen API key"
}

document.getElementById("login").onclick = () => {

const redirect = encodeURIComponent(window.location.href.split("#")[0])

window.location =
`https://enter.pollinations.ai/authorize?redirect_url=${redirect}`

}

document.getElementById("logout").onclick = () => {

localStorage.removeItem("pollinations_key")
apiKey=null
updateKey()
chat.innerHTML=""

}

function strictPrompt(user){

return `Return ONLY valid JSON in this exact format: {"reply":"text"}.
Do not include anything else.
User message: ${user}`

}

function addUser(text){

const div=document.createElement("div")
div.className="msg user"
div.innerHTML="<b>Jij:</b> "+text
chat.appendChild(div)

}

function addAI(text){

const div=document.createElement("div")
div.className="msg ai"
div.innerHTML="<b>AI:</b> "+text
chat.appendChild(div)

}

function addImage(url){

const img=document.createElement("img")
img.src=url
chat.appendChild(img)

}

document.getElementById("send").onclick = async () => {

const user = promptInput.value.trim()

if(!user) return
if(!apiKey) return alert("Login eerst")

promptInput.value=""

addUser(user)

const prompt = strictPrompt(user)

try{

const res = await fetch(
`https://gen.pollinations.ai/text/${encodeURIComponent(prompt)}?model=openai&jsonMode=true`,
{
headers:{Authorization:`Bearer ${apiKey}`}
}
)

const data = await res.json()

addAI(data.reply)

}catch(e){

addAI("Text error")

}

try{

const img = await fetch(
`https://gen.pollinations.ai/image/${encodeURIComponent(user)}?model=flux`,
{
headers:{Authorization:`Bearer ${apiKey}`}
}
)

const blob = await img.blob()
const url = URL.createObjectURL(blob)

addImage(url)

}catch(e){

addAI("Image error")

}

chat.scrollTop = chat.scrollHeight

}

</script>

</body>
</html>
