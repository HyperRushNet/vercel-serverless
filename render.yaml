services:
  - type: web
    name: html-to-markdown-api
    env: node
    plan: free
    buildCommand: npm install && npx puppeteer browsers install chrome
    startCommand: node server.js
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: PUPPETEER_SKIP_CHROMIUM_DOWNLOAD
        value: "false"
